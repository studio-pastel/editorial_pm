<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>エディトリアルPM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Shippori+Mincho:wght@600;800&display=swap">
<style>
/* Layout: left = 台割 spreads board (scrolls), right = sticky 3D book stage; panels fold open above the board. */
:root {
  --bg: #eef1f2;
  --panel: #ffffff;
  --panel-2: #e5eaec;
  --line: #cdd6d9;
  --fg: #172226;
  --mute: #5b6b70;
  --accent: #0d6a78;
  --accent-fg: #ffffff;
  --accent-soft: #d3ebee;
  --warn: #a15c00;
  --warn-soft: #f6e6c9;
  --bad: #b3261e;
  --ok: #2a7a3b;
  --stage: #d9e0e3;
  --violet: #6a4fb3;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111719; --panel: #182024; --panel-2: #1f2a2f; --line: #2e3c42;
    --fg: #e4eaec; --mute: #93a3a9; --accent: #4fc0cf; --accent-fg: #06262b;
    --accent-soft: #17383e; --warn: #e2a64a; --warn-soft: #3a2d14; --bad: #ff8a80; --ok: #7bd58a;
    --stage: #0c1214; --violet: #b49cf2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111719; --panel: #182024; --panel-2: #1f2a2f; --line: #2e3c42;
  --fg: #e4eaec; --mute: #93a3a9; --accent: #4fc0cf; --accent-fg: #06262b;
  --accent-soft: #17383e; --warn: #e2a64a; --warn-soft: #3a2d14; --bad: #ff8a80; --ok: #7bd58a;
  --stage: #0c1214; --violet: #b49cf2; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: auto; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 2200px; margin: 0 auto; padding-block: 14px 40px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .04em; margin: 0; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--font-mono); font-size: 12px; color: var(--mute); min-width: 0; }
.stats b { color: var(--fg); font-weight: 500; }
.stats .warn { color: var(--warn); }
.spacer { flex: 1 1 auto; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 12px; min-height: 34px; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.sm { padding: 3px 9px; min-height: 28px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: default; }

/* panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-top: 12px; }
.panel h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; color: var(--mute); font-weight: 700; }
.grid-form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 14px; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field > span { font-size: 12px; color: var(--mute); }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 6px 8px; min-width: 0; width: 100%; }
.field input[type="color"] { padding: 2px; height: 34px; }
.field textarea { min-height: 84px; font-family: var(--font-mono); font-size: 12px; resize: vertical; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.row > .field { flex: 1 1 200px; }
.msg { margin: 8px 0 0; font-size: 13px; color: var(--mute); min-height: 1.4em; overflow-wrap: anywhere; }
.msg.err { color: var(--bad); }
.msg.ok { color: var(--ok); }
.hint { font-size: 12px; color: var(--mute); margin: 6px 0 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 12px; margin-top: 10px; }
.drop { border: 1.5px dashed var(--line); border-radius: 8px; padding: 16px; text-align: center; color: var(--mute); background: var(--bg); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.srclist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.srclist li { display: flex; gap: 8px; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--bg); min-width: 0; }
.srclist li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.srclist small { font-family: var(--font-mono); color: var(--mute); flex: none; }
.srclist li span { flex: 1 1 auto; }
.srclist em { font-style: normal; font-size: 12px; color: var(--ok); flex: none; }
.srclist em.none { color: var(--warn); }
.diag { display: flex; gap: 12px; align-items: flex-start; margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); min-width: 0; }
.diag canvas { flex: none; border: 1px solid var(--line); background: #fff; }
.diag pre { margin: 0; font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }

/* main two-pane */
.main { display: grid; grid-template-columns: fit-content(46%) minmax(0, 1fr); gap: 20px; margin-top: 14px; align-items: start; }
.main > section { min-width: 0; }
/* labels wrap inside the board's width instead of widening the column */
.boardbar, .legend { width: 0; min-width: 100%; }
body.wide .main { grid-template-columns: minmax(0, 1fr); }
body.wide .main > section { display: none; }
.boardbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; font-size: 13px; color: var(--mute); }
.boardbar input[type="range"] { width: 120px; accent-color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend span { font-size: 12px; }
.board { display: flex; flex-direction: column; gap: 14px; }
.spread { display: flex; align-items: stretch; gap: 0; width: max-content; max-width: 100%; }
.spread-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.spread-wrap.cur .spread { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
.spread-label { font-family: var(--font-mono); font-size: 10px; color: var(--mute); }
.spread-scroll { overflow-x: auto; padding: 4px; margin: -4px; }
.tile { position: relative; flex: none; width: var(--tw, 118px); aspect-ratio: var(--ar, 0.707); background: var(--panel); border: 1px solid var(--line); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; }
.tile.empty { background: var(--panel-2); border-style: dashed; cursor: default; }
.tile.over { outline: 2px dashed var(--accent); outline-offset: -2px; }
.tile .bar { height: 5px; background: var(--sec, var(--line)); flex: none; }
.tile .no { font-family: var(--font-mono); font-size: 10px; padding: 3px 6px 0; display: flex; justify-content: space-between; color: var(--mute); }
.tile .tt { font-size: 11px; line-height: 1.35; padding: 2px 6px 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; flex: 1 1 auto; }
.tile .note { font-size: 9.5px; color: var(--mute); padding: 0 6px 5px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tile img { position: absolute; inset: 5px 0 0 0; width: 100%; height: calc(100% - 5px); object-fit: cover; }
.tile.hasimg .no { position: relative; z-index: 1; background: color-mix(in srgb, var(--panel) 78%, transparent); }
.tile.hasimg .tt, .tile.hasimg .note { display: none; }
.tile .st { position: absolute; right: 5px; bottom: 5px; width: 8px; height: 8px; border-radius: 50%; background: var(--sec, var(--mute)); z-index: 2; }
.tile.cur { box-shadow: 0 0 0 2px var(--accent); z-index: 1; }
.spine-tile { width: 54px; }
.sidepair { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }

/* stage */
.stage { position: sticky; top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.view3d { position: relative; background: var(--stage); height: calc(100vh - 190px); min-height: 380px; touch-action: none; }
.view3d canvas { display: block; width: 100%; height: 100%; }
.view3d .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); text-align: center; padding: 20px; pointer-events: none; }
.ctrl { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
.ctrl input[type="range"] { flex: 1 1 140px; min-width: 100px; accent-color: var(--accent); }
.ctrl .lab { font-family: var(--font-mono); font-size: 12px; color: var(--mute); min-width: 7.5em; text-align: center; }
.cams { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
.cams .spacer { flex: 1 1 auto; }

@media (max-width: 1000px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; order: -1; }
  .view3d { height: 56vh; min-height: 300px; }
  body.wide .view3d { height: calc(100vh - 190px); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

.top .btn { padding: 5px 10px; }
.proj { font-size: 13px; color: var(--mute); max-width: 24ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.btn.login { border-color: var(--accent); color: var(--accent); }
.btn.login.on { background: var(--accent-soft); color: var(--fg); }
.banner { margin: 10px 0 0; padding: 8px 12px; border-radius: 6px; background: var(--warn-soft); color: var(--fg); }
.banner.err { background: color-mix(in srgb, var(--bad) 14%, var(--panel)); color: var(--fg); }
.panel h3 { margin: 14px 0 0; font-size: 13px; font-weight: 700; }
.panel h3 small { font-weight: 400; color: var(--mute); }
.kv { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 4px 0; min-width: 0; }
.kv > span { font-size: 12px; color: var(--mute); min-width: 7em; }
.kv a, .kv code { overflow-wrap: anywhere; min-width: 0; }
.kv code { font-family: var(--font-mono); font-size: 12px; background: var(--bg); padding: 2px 6px; border-radius: 4px; }
.recent { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 4px; }
.recent a { color: var(--accent); }
.howto { margin: 14px 0 0; padding-left: 1.4em; color: var(--mute); font-size: 13px; max-width: 75ch; }
.dlist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.dlist li { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--bg); min-width: 0; }
.dlist .nm { flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlist .meta { font-family: var(--font-mono); font-size: 12px; color: var(--mute); }
.dlist .err { color: var(--bad); font-size: 12px; flex-basis: 100%; }
.dlist input { width: 5.5em; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 2px 6px; }
.dlist a { font-size: 12px; color: var(--accent); }
.progress { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
#login, #landing { max-width: 520px; margin: 9vh auto 0; }
#login h2 { font-family: var(--font-display); font-size: 22px; letter-spacing: .04em; color: var(--fg); margin: 0 0 6px; }
#login p { margin: 0 0 12px; }
#login .lead { font-weight: 700; font-size: 16px; }
.gsi { min-height: 44px; margin: 14px 0 8px; }
body.locked .top > :not(.brand):not(.proj), body.locked .vtabs, body.locked .view, body.locked #detail { display: none !important; }
.muted { color: var(--mute); }

/* view tabs: the project's main navigation */
.vtabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 12px; border-bottom: 2px solid var(--line); }
.vtab { position: relative; border: 0; background: transparent; padding: 10px 18px 9px; font-size: 15px; font-weight: 700; color: var(--mute); border-bottom: 3px solid transparent; margin-bottom: -2px; border-radius: 6px 6px 0 0; }
.vtab:hover { color: var(--fg); background: var(--panel); }
.vtab.on { color: var(--fg); border-bottom-color: var(--accent); background: var(--panel); }
.badge { display: inline-block; min-width: 1.5em; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--warn); color: #1d1300; font-size: 12px; line-height: 1.6; text-align: center; font-family: var(--font-mono); }
.btn.user { border-color: var(--accent); color: var(--fg); max-width: 26ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.btn.xs { padding: 1px 8px; min-height: 24px; font-size: 12px; }
.btn.sm.on, .seg .btn.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.vhead { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 14px; margin-bottom: 8px; }
.vhead h2 { margin: 0 auto 0 0; }
.field.inline { flex-direction: row; align-items: center; gap: 6px; }
.field.inline > span { white-space: nowrap; }
.field.grow { flex: 1 1 220px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.seg { display: inline-flex; gap: 4px; }

/* states */
.chip { display: inline-block; font-size: 11.5px; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); white-space: nowrap; }
.st-done { --c: var(--ok); } .st-doing { --c: var(--warn); } .st-ready { --c: var(--accent); } .st-todo { --c: var(--mute); } .st-other { --c: var(--violet); } .st-none { --c: var(--line); }
.chip[class*="st-"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--panel)); }
.stsel { border: 1px solid var(--c, var(--line)); background: color-mix(in srgb, var(--c, var(--line)) 12%, var(--panel)); border-radius: 5px; padding: 3px 6px; max-width: 11em; }
.tile .tchip { position: absolute; left: 4px; bottom: 4px; right: 18px; z-index: 2; font-size: 9.5px; line-height: 1.45; padding: 0 4px; border-radius: 4px; border-left: 3px solid var(--c); background: color-mix(in srgb, var(--c) 22%, var(--panel)); color: var(--fg); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tile .cbadge { background: var(--warn); color: #1d1300; border-radius: 999px; padding: 0 5px; font-size: 9.5px; font-family: var(--font-mono); position: relative; z-index: 1; }
.tile .note { margin-bottom: 16px; }

/* tables */
.tablewrap { overflow-x: auto; margin-top: 6px; }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.grid th { text-align: left; font-size: 12px; color: var(--mute); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); white-space: nowrap; }
table.grid td { padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.grid td.wrap { min-width: 14em; max-width: 30em; }
table.grid tr:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.pagelink { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; text-align: left; }

/* progress summary */
.srow { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 4px 12px; align-items: center; margin: 8px 0; }
.srow .muted { grid-column: 2; font-size: 12px; }
.sbar { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--panel-2); }
.sbar i { display: block; background: var(--c); min-width: 2px; }
.legend2 { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--mute); margin-top: 6px; }
.legend2 i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 5px; vertical-align: -1px; }

/* comments, figures */
.clist { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 8px; }
.citem { border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 6px; padding: 8px 10px; background: var(--panel); }
.citem.done { border-left-color: var(--ok); opacity: .85; }
.cmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12.5px; }
.ctext { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { margin: 8px 0 0 14px; padding-left: 10px; border-left: 2px solid var(--line); }
.cacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.replybox, .cform { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.replybox textarea, .cform textarea, .form textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 6px 8px; font: inherit; resize: vertical; }
.replybox .btn, .cform .btn { align-self: flex-end; }
.fcard { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; background: var(--panel); }
.fcard p { margin: 4px 0 0; overflow-wrap: anywhere; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px 12px; border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 8px 0 12px; background: var(--bg); }
.form .field.wide { grid-column: 1 / -1; }
.form .field input, .form .field select { width: 100%; }
.formacts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; }
.memadd { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px 12px; align-items: end; margin-bottom: 10px; }
.memadd .field input, .memadd .field select { width: 100%; }
table.grid td input, table.grid td select { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 3px 6px; max-width: 16em; }

/* expenses */
.kpis { display: flex; flex-wrap: wrap; gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 9em; background: var(--bg); }
.kpi span { display: block; font-size: 12px; color: var(--mute); }
.kpi b { font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.bars { display: grid; gap: 6px; margin-top: 14px; max-width: 640px; }
.brow { display: grid; grid-template-columns: 7em minmax(0, 1fr) 8em; gap: 10px; align-items: center; font-size: 13px; }
.brow b { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
.btrack { height: 12px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.btrack i { display: block; height: 100%; background: var(--accent); }

/* page detail */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100vw); z-index: 30; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px color-mix(in srgb, var(--fg) 12%, transparent); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }
.dhead { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.dhead h2 { flex: 1 1 auto; margin: 0; font-size: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbody { overflow-y: auto; padding: 4px 14px 24px; flex: 1 1 auto; }
.dsec { border-bottom: 1px solid var(--line); padding: 10px 0 12px; }
.dsec h3 { margin: 0 0 8px; font-size: 13px; color: var(--mute); letter-spacing: .06em; }
.kvlist { display: grid; grid-template-columns: 7em minmax(0, 1fr); gap: 3px 10px; margin: 0; font-size: 13px; }
.kvlist dt { color: var(--mute); }
.kvlist dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.stages { display: flex; flex-wrap: wrap; gap: 8px 14px; }
.stage { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mute); }
@media (min-width: 1200px) { body.has-detail .wrap { padding-right: 396px; } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 13px; max-width: min(92vw, 640px); box-shadow: 0 6px 20px color-mix(in srgb, var(--fg) 25%, transparent); }
.toast.err { background: var(--bad); color: #fff; }
.pwrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 10px; }
.pwrow .field { flex: 1 1 200px; }

.small { font-size: 12px; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; color: var(--fg); }
#taskTable td:nth-child(3), #taskTable td:nth-child(4), #taskTable td:nth-child(6), table.tcount td, table.tcount th { white-space: nowrap; }

.overdue { font-size: 11.5px; font-weight: 700; }
tr.is-done td { color: var(--mute); }
tr.is-done td b { font-weight: 500; text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--mute) 60%, transparent); }
table.tcount { width: auto; min-width: 520px; }
.brand { max-width: min(60vw, 36ch); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* schedule: Gantt */
.gantt { position: relative; overflow-x: auto; margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.g-inner { position: relative; }
.g-row { display: flex; align-items: stretch; min-height: 38px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); position: relative; }
.g-row:last-child { border-bottom: 0; }
.g-row:hover .g-label, .g-row.sel .g-label { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
.g-label { position: sticky; left: 0; z-index: 3; flex: none; width: var(--lw, 320px); background: var(--panel); border-right: 1px solid var(--line); padding: 5px 10px; display: flex; flex-direction: column; justify-content: center; gap: 1px; text-align: left; min-width: 0; }
button.g-label { border-top: 0; border-bottom: 0; border-left: 0; font: inherit; color: inherit; cursor: pointer; }
.g-name { font-size: 13px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.g-row.is-done .g-name { color: var(--mute); font-weight: 500; }
.g-when { font-family: var(--font-mono); font-size: 11px; color: var(--mute); }
.g-headrow { min-height: 24px; background: var(--panel-2); }
.g-headrow .g-label { background: var(--panel-2); font-size: 11px; color: var(--mute); padding-block: 2px; }
.g-track { position: relative; flex: none; }
.g-months span, .g-weeks span { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; font-size: 11.5px; white-space: nowrap; }
.g-months span { padding-left: 6px; font-weight: 700; border-left: 1px solid var(--line); overflow: hidden; }
.g-weeks span { font-family: var(--font-mono); font-size: 10px; color: var(--mute); padding-left: 2px; }
.g-grid { position: absolute; top: 0; bottom: 0; pointer-events: none; z-index: 1; }
.g-grid i { position: absolute; top: 0; bottom: 0; width: 0; }
.g-mline { border-left: 1px solid var(--line); }
.g-wline { border-left: 1px dashed color-mix(in srgb, var(--line) 70%, transparent); }
.g-today { border-left: 2px solid var(--bad); z-index: 2; }
.g-today b { position: absolute; top: 3px; right: 4px; font-size: 10px; line-height: 1.5; padding: 0 4px; border-radius: 3px; background: var(--panel); color: var(--fg); border: 1px solid var(--bad); white-space: nowrap; font-weight: 700; }
.g-bar { position: absolute; top: 50%; height: 14px; margin-top: -7px; border-radius: 4px; z-index: 2; cursor: default; }
.g-ms { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; transform: rotate(45deg); border-radius: 2px; z-index: 2; box-shadow: 0 0 0 2px var(--panel); }
body.editor .g-bar, body.editor .g-ms { cursor: pointer; }
.g-done { background: color-mix(in srgb, var(--mute) 45%, var(--panel)); }
.g-now { background: var(--warn); }
.g-next { background: var(--accent); }
#schLegend { margin: 4px 0 0; }
#schLegend i.lg { width: 14px; height: 8px; border-radius: 3px; }
#schLegend i.lg.g-done { background: color-mix(in srgb, var(--mute) 45%, var(--panel)); }
#schLegend i.lg.g-now { background: var(--warn); }
#schLegend i.lg.g-next { background: var(--accent); }
#schLegend i.lg-ms { width: 9px; height: 9px; transform: rotate(45deg); background: var(--accent); border-radius: 2px; margin-right: 7px; }
#schLegend i.lg-today { width: 2px; height: 12px; background: var(--bad); border-radius: 0; }
.schform { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); max-width: 640px; }

/* minutes */
.mgrid { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 12px; align-items: start; }
.mgrid > .panel { min-width: 0; }
.mside { position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; }
.tagbar { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 0; }
.chip.tag { font-size: 11.5px; background: var(--panel-2); color: var(--fg); }
button.chip.tag { cursor: pointer; }
button.chip.tag.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.mlist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; overflow-y: auto; min-height: 0; }
.mitem { width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); padding: 7px 10px; display: flex; flex-direction: column; gap: 2px; }
.mitem:hover { border-color: var(--accent); }
.mitem.on { border-color: var(--accent); background: var(--accent-soft); }
.mdate { font-family: var(--font-mono); font-size: 11.5px; color: var(--mute); }
.mtitle { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.mtags { display: flex; flex-wrap: wrap; gap: 4px; margin: 2px 0 0; }
.mhead { border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 4px; }
.mhead p { margin: 4px 0 0; }
.panel h2.mdoc-title { font-family: var(--font-display); font-size: 22px; letter-spacing: .02em; color: var(--fg); margin: 2px 0 4px; font-weight: 800; }
.panel h2.mdoc-edit { color: var(--fg); font-size: 15px; }
.mform { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); margin-top: 0; }
.mdedit { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.mdedit textarea.md-src { min-height: 52vh; font-family: var(--font-mono); font-size: 13px; line-height: 1.65; resize: vertical; tab-size: 2; }
.md-preview { border: 1px solid var(--line); border-radius: 5px; padding: 4px 14px; min-height: 52vh; max-height: 70vh; overflow-y: auto; background: var(--panel); }
.md-body { font-size: 14.5px; line-height: 1.8; overflow-wrap: anywhere; max-width: 80ch; }
.md-body h1, .md-body h2, .md-body h3, .md-body h4 { font-family: var(--font-body); color: var(--fg); letter-spacing: .02em; line-height: 1.4; margin: 1.4em 0 .5em; }
.md-body h1 { font-size: 20px; } .md-body h2 { font-size: 17px; border-bottom: 1px solid var(--line); padding-bottom: 3px; } .md-body h3 { font-size: 15px; } .md-body h4 { font-size: 14px; }
.md-body p, .md-body ul, .md-body ol, .md-body blockquote, .md-body pre, .md-body table { margin: .6em 0; }
.md-body ul, .md-body ol { padding-left: 1.5em; }
.md-body li > input[type="checkbox"], .field .md-body li > input[type="checkbox"] { width: auto; min-width: 0; padding: 0; border: 0; background: none; display: inline-block; margin: 0 .4em 0 -.2em; vertical-align: -1px; }
.md-body li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.2em; }
.md-body code { font-family: var(--font-mono); font-size: .9em; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
.md-body pre { background: var(--panel-2); padding: 10px 12px; border-radius: 6px; overflow-x: auto; }
.md-body pre code { background: none; padding: 0; }
.md-body blockquote { border-left: 3px solid var(--line); padding-left: 12px; color: var(--mute); }
.md-body table { border-collapse: collapse; font-size: 13.5px; display: block; overflow-x: auto; max-width: 100%; }
.md-body th, .md-body td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
.md-body th { background: var(--panel-2); }
.md-body a { color: var(--accent); }
.md-body hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
.md-raw { white-space: pre-wrap; font-family: var(--font-mono); font-size: 13px; }
@media (max-width: 1100px) { .mdedit { grid-template-columns: minmax(0, 1fr); } .mdedit textarea.md-src, .md-preview { min-height: 34vh; } }
@media (max-width: 900px) { .mgrid { grid-template-columns: minmax(0, 1fr); } .mside { position: static; max-height: none; } .mlist { max-height: 46vh; } }
.hint a, .foot a { color: var(--accent); }
.projlist { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.projitem { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); text-decoration: none; }
.projitem:hover { border-color: var(--accent); }
.projitem b { font-size: 15px; }
#landing #projAdd h3 { margin-top: 18px; }
.memadd .check { align-self: center; }
.foot { max-width: 2200px; margin: 0 auto; padding: 0 0 24px; font-size: 12px; color: var(--mute); }
body.locked .foot { display: none; }
body:not(.editor) .edonly { display: none !important; }
body.editor .viewonly { display: none !important; }
</style>
